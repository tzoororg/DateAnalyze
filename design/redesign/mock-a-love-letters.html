<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock A · Love Letters</title>
<style>
  /* Direction A: "Love Letters" — pink gingham scrapbook. Cherry red accent,
     taped polaroid photos, handwritten headers. Light theme. */
  :root {
    --bg: #fbe9ee;
    --gingham-a: rgba(233, 150, 172, .14);
    --gingham-b: rgba(233, 150, 172, .10);
    --card: #fffdfb;
    --card-2: #fef2f0;
    --line: #f2cdd6;
    --text: #4d2b34;
    --muted: #a4707f;
    --accent: #e8577e;       /* charter raspberry */
    --accent-soft: #f6d7de;
    --tape: rgba(240, 190, 160, .55);
    --radius: 14px;
    --shadow: 0 4px 12px rgba(160, 70, 95, .14);
    --cursive: "Segoe Script", "Bradley Hand", cursive;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 390px; min-height: 844px; margin: 0 auto;
    background:
      repeating-linear-gradient(0deg, var(--gingham-a) 0 14px, transparent 14px 28px),
      repeating-linear-gradient(90deg, var(--gingham-b) 0 14px, transparent 14px 28px),
      var(--bg);
    color: var(--text);
    font: 15px/1.4 "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 4px; }
  .title { font: 700 27px var(--cursive); color: var(--accent); transform: rotate(-2deg); }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 12px; border: 1.5px solid var(--line);
    background: var(--card); color: var(--muted); font-size: 17px;
    display: grid; place-items: center; box-shadow: var(--shadow);
  }
  .tabs { display: flex; gap: 6px; padding: 8px 16px 12px; }
  .tab {
    flex: 1; text-align: center; padding: 8px 0; border-radius: 999px;
    background: var(--card); border: 1.5px solid var(--line);
    color: var(--muted); font-size: 12.5px; font-weight: 700;
  }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .view { padding: 0 16px 96px; } /* list scrolls clear of the FAB */

  /* Memory card: a letter clipping with washi tape */
  .memory {
    position: relative; background: var(--card-2); border-radius: 4px;
    padding: 14px 14px 12px; margin-bottom: 16px; box-shadow: var(--shadow);
    transform: rotate(-.6deg);
    border: 1px solid var(--line);
  }
  .memory::before {
    content: ""; position: absolute; top: -9px; left: 50%; width: 84px; height: 20px;
    transform: translateX(-50%) rotate(-2deg);
    background: var(--tape); border-radius: 2px;
  }
  .memory .when { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); margin-bottom: 3px; }
  .memory .line { font-size: 14px; }
  .memory .line b { font-weight: 700; }

  /* Date cards: photo full-bleed, metadata overlaid on a bottom scrim.
     All cards share one 165px height (charter: consistent geometry). */
  .polaroid {
    position: relative; border-radius: var(--radius); overflow: hidden;
    box-shadow: var(--shadow); margin-bottom: 14px; border: 1px solid var(--line);
  }
  .polaroid img { width: 100%; height: 165px; object-fit: cover; display: block; }
  .scrim {
    position: absolute; inset: auto 0 0 0; padding: 28px 13px 9px;
    background: linear-gradient(180deg, transparent, rgba(45, 14, 24, .9));
    display: flex; align-items: baseline; gap: 8px; color: #fff;
  }
  .scrim .name { font-weight: 700; font-size: 15px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scrim .date { color: #f0cdd8; font-size: 12px; }
  .scrim .hearts { color: var(--accent-2, #ff9fba); font-size: 12.5px; letter-spacing: 1px; }

  /* Compact keepsakes strip: one row, stitched divider */
  .keepsakes {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 12px;
    padding: 7px 18px; margin: 2px 0 14px; box-shadow: var(--shadow);
  }
  .keep { text-align: center; }
  .keep .n { font: 700 18px Georgia, serif; color: var(--accent); }
  .keep .l { font-size: 10.5px; color: var(--muted); font-weight: 700; }
  .keepsakes .sep { width: 1px; height: 26px; background: var(--line); }

  .fab {
    position: fixed; right: calc(50% - 195px + 16px); bottom: 22px;
    width: 56px; height: 56px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; font-size: 26px;
    box-shadow: 0 8px 18px rgba(201, 41, 78, .4);
    display: grid; place-items: center;
  }
</style>
</head>
<body>
  <header>
    <div class="title">Us ♥</div>
    <div class="icon-btn">⋯</div>
  </header>
  <nav class="tabs">
    <div class="tab on">Home</div>
    <div class="tab">History</div>
    <div class="tab">Insights</div>
    <div class="tab">Suggest</div>
  </nav>
  <main class="view">
    <div class="memory">
      <div class="when">one year ago today</div>
      <div class="line">You two were at <b>the night picnic on the roof</b>. It got 5 hearts.</div>
    </div>

    <div class="keepsakes">
      <div class="keep"><div class="n">47</div><div class="l">dates</div></div>
      <div class="sep"></div>
      <div class="keep"><div class="n">12</div><div class="l">this year</div></div>
      <div class="sep"></div>
      <div class="keep"><div class="n">4.3</div><div class="l">avg ♥</div></div>
    </div>

    <div class="polaroid">
      <img src="https://picsum.photos/seed/couple-evening-market/780/340" alt="">
      <div class="scrim">
        <div class="name">Night market by the port</div>
        <div class="date">Sat · Jul 26</div>
        <div class="hearts">♥♥♥♥♥</div>
      </div>
    </div>

    <div class="polaroid">
      <img src="https://picsum.photos/seed/homemade-pasta-kitchen/780/260" alt="">
      <div class="scrim">
        <div class="name">Pasta from scratch, take two</div>
        <div class="date">Tue · Jul 15</div>
        <div class="hearts">♥♥♥♥</div>
      </div>
    </div>

    <div class="polaroid">
      <img src="https://picsum.photos/seed/sunrise-hike-trail/780/260" alt="">
      <div class="scrim">
        <div class="name">Sunrise hike, almost on time</div>
        <div class="date">Sun · Jul 6</div>
        <div class="hearts">♥♥♥</div>
      </div>
    </div>
  </main>
  <button class="fab">+</button>
</body>
</html>
