<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* Design tokens copied from css/styles.css :root (Plum, the app's default theme) */
  :root {
    --bg: #2a1b26;
    --bg-soft: #33222e;
    --accent: #ff7fa2;
    --accent-2: #ff9fba;
    --text: #f5e6ee;
    --muted: #c99bb0;
    --cursive: "Segoe Script", "Comic Sans MS", cursive;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 1024px; height: 500px; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  body {
    background: radial-gradient(120% 90% at 18% 30%, var(--bg-soft), var(--bg) 70%);
    color: var(--text);
    display: flex; align-items: center;
    position: relative;
  }
  /* Faint decorative hearts, echoes the app's sticker-book motif without being a screenshot */
  .heart-deco {
    position: absolute; color: var(--accent); opacity: .12; font-size: 160px;
    transform: rotate(-8deg);
  }
  .h1 { top: -40px; right: 60px; }
  .h2 { bottom: -60px; right: 260px; font-size: 110px; transform: rotate(10deg); }
  .h3 { top: 40px; right: 380px; font-size: 70px; transform: rotate(-15deg); }

  .content { position: relative; z-index: 1; padding: 0 0 0 72px; }
  .title {
    font: 700 88px var(--cursive); color: var(--accent); margin: 0;
    transform: rotate(-2deg); display: flex; align-items: center; gap: 18px;
    text-shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  .title .heart { color: var(--accent); font-family: sans-serif; }
  .tagline {
    margin: 22px 0 0; font-size: 34px; font-weight: 600; color: var(--text);
    max-width: 760px;
  }
  .sub {
    margin: 14px 0 0; font-size: 24px; font-weight: 600; color: var(--accent-2);
    letter-spacing: .02em;
  }
</style>
</head>
<body>
  <span class="heart-deco h1">&#9829;</span>
  <span class="heart-deco h2">&#9829;</span>
  <span class="heart-deco h3">&#9829;</span>
  <div class="content">
    <p class="title">Us <span class="heart">&#9829;</span></p>
    <p class="tagline">Log your dates, see the story, get inspired for the next one.</p>
    <p class="sub">Free &middot; no ads &middot; works offline &middot; end&#8209;to&#8209;end encrypted</p>
  </div>
</body>
</html>
